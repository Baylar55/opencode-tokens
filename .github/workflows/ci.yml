name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
        include:
          - os: ubuntu-latest
            node: '22.13.0' # oldest supported version (engines.node)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: node bin/opencode-tokens.js --help

  # Publishes to npm when package.json has a version that is not on npm yet,
  # then creates the matching GitHub release. Other commits skip this.
  publish:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency: publish
    permissions:
      contents: write # tag + GitHub release
      id-token: write # npm provenance
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Check version
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm, nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::$NAME@$VERSION is not on npm, but the NPM_TOKEN secret is not set. Skipping publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.publish == 'true'
        run: npm publish --provenance --access public
      - if: steps.check.outputs.publish == 'true'
        name: GitHub release
        run: |
          TAG="v${{ steps.check.outputs.version }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
